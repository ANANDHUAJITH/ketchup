title   Ketchup (zen kernel)
sort-key A
linux   /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-zen
initrd  /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-zen.img
options archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cow_spacesize=10G copytoram=n module_blacklist=pcspkr nvme_load=yes quiet splash loglevel=3
