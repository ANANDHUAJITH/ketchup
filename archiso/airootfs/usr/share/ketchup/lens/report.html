<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ketchup Lens report</title>
<style>
:root{--bg:#14090a;--panel:#1f1112;--panel2:#291719;--line:#4a2a2c;--fg:#f3e6dc;--dim:#b39d94;--red:#e63a2e;--kernel:#e63a2e;--user:#4fb3a9;--loader:#e0a73a;--io:#7aa2f7;--ok:#6cc17a}
@media (prefers-color-scheme: light){:root{--bg:#fbf4ef;--panel:#fff;--panel2:#f6e9e2;--line:#e0c9bf;--fg:#2a1517;--dim:#7a625b}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,"Noto Sans",sans-serif}
header{display:flex;gap:16px;align-items:center;padding:14px 22px;border-bottom:1px solid var(--line);background:var(--panel)}
header img{height:64px;width:auto}header h1{margin:0;font-size:20px}header .sub{color:var(--dim);font-size:13px;word-break:break-all}
nav{display:flex;gap:4px;flex-wrap:wrap;padding:8px 22px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
nav button{background:none;border:1px solid transparent;color:var(--dim);padding:6px 12px;border-radius:8px;cursor:pointer;font:inherit}
nav button.on{color:var(--fg);background:var(--panel2);border-color:var(--red)}
main{padding:18px 22px;max-width:1200px;margin:auto}
section{display:none}section.on{display:block}
h2{margin:6px 0 4px}h3{margin:18px 0 6px;color:var(--red)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:12px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.stat b{display:block;font-size:22px}.stat span{color:var(--dim);font-size:13px}
.dim{color:var(--dim)}.note{border-left:3px solid var(--loader);padding:6px 10px;background:var(--panel2);border-radius:0 8px 8px 0;margin:8px 0;font-size:14px}
.warn{border-left-color:var(--red)}
table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:4px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}code,.mono{font-family:ui-monospace,"Noto Sans Mono",monospace;font-size:12.5px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}.chip{border:1px solid var(--line);border-radius:99px;padding:2px 10px;cursor:pointer;font-size:13px;background:var(--panel)}
.chip.on{background:var(--red);color:#fff;border-color:var(--red)}
tr.sel{background:var(--panel2)}tr.click{cursor:pointer}tr.click:hover{background:var(--panel2)}.err{color:var(--red)}
svg text{fill:var(--fg);font:12px system-ui}svg .d{fill:var(--dim)}
.regs{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:6px}
.reg{background:var(--panel2);border-radius:8px;padding:6px 10px}.reg b{color:var(--red)}.reg .v{font-family:ui-monospace,monospace;font-size:12.5px;word-break:break-all}
.layer{display:flex;gap:10px;margin:6px 0;flex-wrap:wrap}.layer>div{flex:1;min-width:220px;border-radius:10px;padding:10px 12px;border:1px solid var(--line)}
select{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:4px 8px;font:inherit}
.mascot{height:90px;float:right;margin:0 0 8px 12px}
footer{padding:20px;color:var(--dim);text-align:center;font-size:12px}
</style>
</head>
<body>
<header>
  <img id="logo" src="file:///usr/share/ketchup/mascot/fighter.svg" alt="" onerror="this.style.display='none'">
  <div><h1>Ketchup Lens</h1><div class="sub" id="cmdline"></div><div class="sub" id="whenhost"></div></div>
</header>
<nav id="nav"></nav>
<main id="main"></main>
<footer>Generated by <code>ketchup-lens</code>. All numbers come from your machine (strace, perf, gdb, /proc, /sys) unless a table says “typical”.</footer>

<script>

};
const SYSNUM = {0:"read",1:"write",2:"open",3:"close",4:"stat",5:"fstat",8:"lseek",9:"mmap",10:"mprotect",11:"munmap",12:"brk",16:"ioctl",21:"access",39:"getpid",56:"clone",57:"fork",59:"execve",60:"exit",61:"wait4",202:"futex",231:"exit_group",257:"openat",262:"newfstatat"};

/* ---------- layout ---------- */
const TABS = [["story", "Story"], ["calls", "System calls"], ["mem", "Memory"], ["cpu", "CPU & registers"], ["hw", "Hardware map"], ["disk", "Disk & I/O"], ["learn", "Learn"]];
const nav = document.getElementById("nav"), main = document.getElementById("main");
const views = {};

/* ---------- System calls ---------- */

/* ---------- Memory ---------- */

    el.append(h("h3", {}, "RAM actually used over time (sampled from /proc)"));
    el.append(h("div", {class: "grid"},
      h("div", {class: "card"}, h("b", {}, "Resident memory (RSS): real RAM pages"), lineChart(s.map(p => [p.t, p.rss * 1024]), {fmtY: fmtB})),
      h("div", {class: "card"}, h("b", {}, "Virtual size: address space promised"), lineChart(s.map(p => [p.t, p.vsz * 1024]), {fmtY: fmtB, color: "var(--io)"})),
      h("div", {class: "card"}, h("b", {}, "Minor page faults (cumulative)"), lineChart(s.map(p => [p.t, p.minflt]), {fmtY: fmtN, color: "var(--loader)"}))));
    const last = s[s.length - 1];
    el.append(h("div", {class: "note"}, "This run caused " + last.minflt + " minor page faults (the page was already in RAM or needed zeroing: cheap, ~0.1–1 µs) and " + last.majflt + " major faults (the data had to come from disk: ~100 µs on SSD, ~10 ms on HDD). Faults × page size = " + fmtB(last.minflt * (D.hw.page_size || 4096)) + " of pages touched."));
  }
  return el;
}

/* ---------- CPU ---------- */
function buildCpu() {
  const el = h("section", {id: "cpu"});
  el.append(h("h2", {}, "CPU: registers and counters"), mascot("angry"));
  const order = ["rip", "rsp", "rbp", "rax", "rbx", "rcx", "rdx", "rsi", "rdi", "r8", "r9", "r10", "r11", "r12", "r13", "r14", "r15", "eflags", "cs", "ss", "fs_base", "gs_base"];
  if (D.snaps.length) {
    const sel = h("select", {}, ...D.snaps.map((s, i) => h("option", {value: i}, s.title))), box = h("div"), why = h("div", {class: "note"});
    const draw = () => {
      const s = D.snaps[sel.value]; why.textContent = s.why;
      const items = order.filter(r => s.regs[r]).map(r => h("div", {class: "reg", title: REG_INFO[r] || ""}, h("b", {}, r), " ", h("span", {class: "dim"}, REG_INFO[r] ? "· " + REG_INFO[r].split(".")[0] : ""), h("div", {class: "v"}, s.regs[r].hex, " ", h("span", {class: "dim"}, s.regs[r].note.replace(s.regs[r].hex, "").trim()))));
      const extra = [];
      if (s.label !== "entry" && s.regs.rax) { const n = parseInt(s.regs.rax.hex, 16); extra.push(h("div", {class: "note"}, "rax = " + n + ": this is the syscall number → " + (SYSNUM[n] || "syscall " + n) + "(). The arguments sit in rdi, rsi, rdx (fd, buffer address, length for write).")); }
      if (s.flags.length) extra.push(h("div", {class: "note"}, "eflags set: ", s.flags.map(f => f.f + (f.meaning ? " (" + f.meaning + ")" : "")).join(", ")));
      if (s.regs.cs) { const ring = parseInt(s.regs.cs.hex, 16) & 3; extra.push(h("div", {class: "note"}, "cs & 3 = " + ring + ": as seen by the debugger the CPU is in " + (ring === 3 ? "user mode (ring 3)" : "kernel mode (ring 0)") + "; the syscall/sysret instructions flip this in a few cycles.")); }
      box.replaceChildren(h("div", {class: "regs"}, items), ...extra);
    };
    sel.addEventListener("change", draw);
    el.append(h("div", {class: "card"}, h("b", {}, "Registers at: "), sel, why, box)); draw();
  } else el.append(h("div", {class: "note warn"}, "No register snapshots (gdb missing or ptrace blocked)."));
  el.append(h("h3", {}, "Performance counters (perf stat)"));
  const p = D.perf;
  if (!p) el.append(h("div", {class: "note warn"}, "perf data unavailable (package perf; on an installed system: sudo sysctl kernel.perf_event_paranoid=1)."));
  else {
    if (p.note) el.append(h("div", {class: "note"}, p.note));
    el.append(h("div", {class: "card"}, h("table", {}, h("tbody", {}, ...Object.entries(p.events).map(([k, v]) => h("tr", {}, h("td", {class: "mono"}, k), h("td", {class: "n"}, v == null ? "not supported" : fmtN(v))))))));
    const d = p.derived, rows = [];
    if (d.ipc != null) rows.push(["Instructions per cycle (IPC)", d.ipc.toFixed(2), d.ipc > 2 ? "High: the CPU is busy doing useful work (compute-bound, cache-friendly)." : d.ipc < 0.8 ? "Low: the CPU is mostly stalled waiting for memory or I/O." : "Typical."]);
    if (d.cache_miss_rate != null) rows.push(["Last-level cache miss rate", (d.cache_miss_rate * 100).toFixed(1) + " %", "Misses go all the way to RAM (~80 ns each, hundreds of cycles)."]);
    if (d.branch_miss_rate != null) rows.push(["Branch mispredict rate", (d.branch_miss_rate * 100).toFixed(2) + " %", "Each mispredict flushes the pipeline (~15–20 cycles)."]);
    if (rows.length) el.append(h("div", {class: "card"}, h("table", {}, h("tbody", {}, ...rows.map(r => h("tr", {}, h("td", {}, r[0]), h("td", {class: "n"}, r[1]), h("td", {class: "dim"}, r[2])))))));
  }
  if (D.samples.length > 1) {
    const l = D.samples[D.samples.length - 1];
    el.append(h("div", {class: "note"}, "Scheduler view: " + l.vol + " voluntary context switches (the process waited, e.g. for I/O or a sleep) and " + l.invol + " involuntary ones (the kernel's timer interrupt took the CPU away). User CPU time " + l.utime.toFixed(2) + " s, kernel time " + l.stime.toFixed(2) + " s."));
  }
  return el;
}

/* ---------- Hardware map ---------- */
function buildHw() {
  const el = h("section", {id: "hw"});
  const hw = D.hw, c = hw.cpu;
  el.append(h("h2", {}, "Hardware map: where your data lives"), mascot("back"));
  el.append(h("p", {class: "dim"}, "Data moves between layers; each step down is bigger but much slower. Sizes below are read from this machine; latencies in the diagram are typical values."));
  const lv = {}; hw.caches.forEach(x => { if (x.type !== "Instruction") lv["L" + x.level] = x.size; });
  const boxes = [["CPU registers", "16 × 64-bit + flags", "~0.3 ns (1 cycle)", "#e63a2e"], ["L1 cache", lv.L1 || "?", "~1 ns", "#e0a73a"], ["L2 cache", lv.L2 || "?", "~4 ns", "#e0a73a"], ["L3 cache", lv.L3 || "?", "~15 ns", "#e0a73a"],
    ["RAM", fmtB((hw.mem.MemTotal || 0) * 1024), "~80 ns", "#4fb3a9"], ["Disk (SSD/HDD)", (hw.disks.filter(d => d.type === "disk")[0] || {}).size || "?", "~80 µs SSD · ~10 ms HDD", "#7aa2f7"]];
  const svg = S("svg", {width: "100%", viewBox: "0 0 800 330", style: "max-width:800px"});
  boxes.forEach((b, i) => {
    const w = 260 + i * 90, x = (800 - w) / 2, y = 8 + i * 52;
    svg.append(S("rect", {x, y, width: w, height: 44, rx: 8, fill: b[3], opacity: 0.88}));
    svg.append(S("text", {x: x + 10, y: y + 19, style: "fill:#111;font-weight:600"}, b[0] + "  ·  " + b[1]));
    svg.append(S("text", {x: x + 10, y: y + 36, style: "fill:#111"}, "latency " + b[2]));
  });
  el.append(h("div", {class: "card"}, svg, h("div", {class: "dim"}, c.model + " · " + c.cores + " cores / " + c.threads + " threads · page size " + hw.page_size + " B · kernel " + hw.kernel + (hw.hypervisor ? " · running inside a virtual machine (cache sizes may be virtualised)" : ""))));
  if (D.latency && D.latency.points.length) {
    const pts = D.latency.points, w = 700, ht = 220, xs = pts.map(p => Math.log2(p.bytes)), x0 = Math.min(...xs), x1 = Math.max(...xs), y1 = Math.max(...pts.map(p => p.ns)) * 1.1;
    const X = v => 55 + ((Math.log2(v) - x0) / (x1 - x0)) * (w - 70), Y = v => ht - (v / y1) * (ht - 12) + 6;
    const ch = S("svg", {width: "100%", viewBox: "0 0 " + w + " " + (ht + 40), style: "max-width:760px"});
    ch.append(S("line", {x1: 55, y1: ht + 6, x2: w - 10, y2: ht + 6, stroke: "var(--line)"}), S("line", {x1: 55, y1: 6, x2: 55, y2: ht + 6, stroke: "var(--line)"}));
    hw.caches.filter(x => x.type !== "Instruction").forEach(x => {
      const b = parseInt(x.size) * (/M/.test(x.size) ? 1048576 : 1024);
      if (b && Math.log2(b) >= x0 && Math.log2(b) <= x1) { ch.append(S("line", {x1: X(b), y1: 6, x2: X(b), y2: ht + 6, stroke: "var(--loader)", "stroke-dasharray": "4 4"})); ch.append(S("text", {x: X(b) + 3, y: 20, class: "d"}, "L" + x.level + " " + x.size)); }
    });
    ch.append(S("polyline", {points: pts.map(p => X(p.bytes) + "," + Y(p.ns)).join(" "), fill: "none", stroke: "var(--red)", "stroke-width": 2.5}));
    pts.forEach(p => ch.append(S("circle", {cx: X(p.bytes), cy: Y(p.ns), r: 3, fill: "var(--red)"}, S("title", {}, fmtB(p.bytes) + ": " + p.ns.toFixed(1) + " ns"))));
    ch.append(S("text", {x: 55, y: ht + 28, class: "d"}, "working set size (log scale) →   " + fmtB(pts[0].bytes) + " … " + fmtB(pts[pts.length - 1].bytes)), S("text", {x: 2, y: 14, class: "d"}, y1.toFixed(0) + " ns"));
    el.append(h("h3", {}, "Measured memory latency on this machine"), h("div", {class: "card"}, ch, h("div", {class: "dim"}, "Random pointer-chasing: each load depends on the previous one, so the time per load is the true latency of whichever level the working set fits in. Steps in the curve = cache boundaries.")));
  } else el.append(h("div", {class: "note"}, "Run ketchup-lens latency (or trace with --latency) to add a measured cache-latency curve of this machine here."));
  const crow = x => h("tr", {}, h("td", {}, "L" + x.level), h("td", {}, x.type), h("td", {}, x.size), h("td", {}, x.ways), h("td", {}, x.line + " B"), h("td", {}, x.sets));
  const chead = h("tr", {}, ...["level", "type", "size", "ways", "line", "sets"].map(x => h("th", {}, x)));
  el.append(h("h3", {}, "Cache details (from /sys)"),
    h("div", {class: "card"}, h("table", {}, h("thead", {}, chead), h("tbody", {}, ...hw.caches.map(crow))),
      h("div", {class: "dim"}, "Lines are the unit of transfer: touching one byte loads the whole 64-byte line. Sequential access reuses it; random access wastes it.")));
  return el;
}

/* ---------- Disk ---------- */
function buildDisk() {
  const el = h("section", {id: "disk"});
  el.append(h("h2", {}, "Disk & I/O: the page cache in the middle"), mascot("sleeping"));
  const s = D.samples, l = s.length ? s[s.length - 1] : null;
  const fileCalls = D.calls.filter(c => ["read", "pread64", "write", "pwrite64"].includes(c.name));
  const sum = n => fileCalls.filter(c => c.name.includes(n)).reduce((a, c) => a + (/^\d+/.test(c.ret) ? parseInt(c.ret) : 0), 0);
  el.append(h("div", {class: "grid"}, ...[[fmtB(sum("read")), "bytes returned by read() calls"], [fmtB(sum("write")), "bytes passed to write() calls"],
    [l ? fmtB(l.rbytes) : "n/a", "bytes actually read from the storage device"], [l ? fmtB(l.wbytes) : "n/a", "bytes sent to the storage device"]].map(([v, t]) => h("div", {class: "card stat"}, h("b", {}, v), h("span", {}, t)))));
  el.append(h("div", {class: "note"}, "read()/write() talk to the page cache in RAM. Only when a page is missing (read) or the kernel flushes dirty pages (write-back, usually seconds later) does the disk driver get involved. If “read() bytes” is large but “storage read” is ~0, the data was already cached: run the same program twice and compare."));
  const m = D.hw.mem;
  el.append(h("div", {class: "card"}, h("b", {}, "System-wide RAM roles: "), "page cache " + fmtB((m.Cached || 0) * 1024) + ", dirty (not yet written) " + fmtB((m.Dirty || 0) * 1024) + ", program memory (anonymous) " + fmtB((m.AnonPages || 0) * 1024) + ", available " + fmtB((m.MemAvailable || 0) * 1024) + "."));
  el.append(h("h3", {}, "Devices"), h("div", {class: "card"}, h("table", {}, h("tbody", {}, ...D.hw.disks.map(d => h("tr", {}, h("td", {class: "mono"}, "/dev/" + d.name), h("td", {}, d.size), h("td", {}, d.type), h("td", {}, d.rota === true || d.rota === "1" || d.rota === 1 ? "spinning (HDD)" : "flash/SSD/virtual"), h("td", {class: "dim"}, d.model || "")))))));
  if (s.length > 1) el.append(h("div", {class: "card"}, h("b", {}, "Bytes read via read() over time"), lineChart(s.map(p => [p.t, p.rchar]), {fmtY: fmtB, color: "var(--io)"})));
  return el;
}

/* ---------- Learn ---------- */
function buildLearn() {
  const el = h("section", {id: "learn"});
  el.append(h("h2", {}, "What to learn from this report"), mascot("standing"));
  const L = [
    ["Privilege & syscalls", "User code runs in ring 3 and cannot touch hardware or other processes. A syscall is the only door; count them in the System calls tab and read what each one asked the kernel to do."],
    ["Process creation", "fork/clone duplicates (copy-on-write), execve replaces the image. The Story tab marks execve and any children."],
    ["Dynamic linking", "ld.so maps libc and friends before main() runs. Look for the 'map libc.so.6' markers; a static binary has none."],
    ["Virtual memory", "Addresses in the Memory tab are virtual. The same address in two processes maps to different RAM. Pages are populated on first touch (page faults)."],
    ["Caches", "RAM is ~100× slower than L1. The latency curve shows your real cache sizes as steps. perf's cache-miss rate tells you whether your access pattern wastes lines."],
    ["The page cache", "Disk I/O goes through RAM. That is why a second read of a file is instant, and why writes seem fast but data may still be in memory (fsync forces it out)."],
    ["Scheduling", "Voluntary switches = you waited; involuntary = the timer interrupt preempted you. Try the readfile and busy_loop samples side by side."],
  ];
  el.append(h("div", {}, ...L.map(([t, d]) => h("div", {class: "card"}, h("b", {}, t), h("div", {class: "dim"}, d)))));
  el.append(h("h3", {}, "Next steps"), h("div", {class: "card"}, h("ul", {}, h("li", {}, h("code", {}, "ketchup-lens samples"), " – small C programs that each demonstrate one idea."), h("li", {}, h("code", {}, "ketchup-lens sim"), " – a toy computer you can single-step: registers, MMU, TLB, cache, page faults, system calls, scheduler."), h("li", {}, h("code", {}, "ketchup-lens latency"), " – measure your caches."), h("li", {}, "Study guide: ", h("code", {}, "/usr/share/doc/ketchup/STUDY.md")))));
  return el;
}

/* ---------- boot ---------- */
document.getElementById("cmdline").textContent = "$ " + D.meta.cmd.join(" ");
document.getElementById("whenhost").textContent = D.meta.when + " · " + D.meta.host + " · kernel " + D.hw.kernel;
document.title = "Ketchup Lens – " + D.meta.cmd[0];
const builders = {story: buildStory, calls: buildCalls, mem: buildMem, cpu: buildCpu, hw: buildHw, disk: buildDisk, learn: buildLearn};
for (const [id, label] of TABS) {
  nav.append(h("button", {"data-t": id, onclick: () => show(id)}, label));
  let v; try { v = builders[id](); } catch (e) { v = h("section", {id}, h("div", {class: "note warn"}, "Could not draw this tab: " + e.message)); }
  views[id] = v; main.append(v);
}
{ const t = (location.hash || "#story").slice(1); show(t in views ? t : "story"); }
</script>
</body>
