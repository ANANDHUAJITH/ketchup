<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>About Ketchup</title>
<style>
:root{--bg:#14090a;--panel:#1f1112;--panel2:#291719;--line:#4a2a2c;--fg:#f3e6dc;--dim:#b39d94;--red:#e63a2e;--link:#7aa2f7}
@media (prefers-color-scheme: light){:root{--bg:#fbf4ef;--panel:#fff;--panel2:#f6e9e2;--line:#e0c9bf;--fg:#2a1517;--dim:#7a625b;--link:#2457c5}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 system-ui,"Noto Sans",sans-serif}
header{display:flex;gap:16px;align-items:center;padding:22px;border-bottom:1px solid var(--line);background:var(--panel)}
.logo{height:76px;width:auto}
.logo.l{display:inline}.logo.d{display:none}
@media (prefers-color-scheme: light){.logo.l{display:none}.logo.d{display:inline}}
header h1{margin:0;font-size:22px}
header .sub{color:var(--dim);font-size:13px}
.wrap{max-width:860px;margin:auto;padding:22px}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:0 0 18px}
a.btn{color:var(--fg);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px 14px;text-decoration:none;font-size:14px}
a.btn.p{background:var(--red);border-color:var(--red);color:#fff}
a.btn:hover{border-color:var(--red)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 22px;margin:14px 0}
.readme a{color:var(--link)}
.readme h1,.readme h2,.readme h3{color:var(--red);line-height:1.3}
.readme h1{font-size:22px;margin-top:0}
.readme h2{font-size:18px;border-bottom:1px solid var(--line);padding-bottom:6px;margin-top:28px}
.readme h3{font-size:16px;margin-top:20px}
.readme code{font-family:ui-monospace,"Noto Sans Mono",monospace;font-size:13px;background:var(--panel2);padding:1px 6px;border-radius:5px}
.readme pre{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:12px 14px;overflow-x:auto}
.readme pre code{background:none;padding:0}
.readme table{border-collapse:collapse;width:100%;font-size:14px;margin:10px 0}
.readme th,.readme td{border:1px solid var(--line);padding:6px 10px;text-align:left}
.readme blockquote{border-left:3px solid var(--red);margin:10px 0;padding:2px 14px;color:var(--dim)}
.readme img{max-width:100%}
.readme ul,.readme ol{padding-left:22px}
.state{color:var(--dim);font-size:14px;padding:6px 2px}
.err{border-left:3px solid var(--red);background:var(--panel2);border-radius:0 8px 8px 0;padding:10px 14px;font-size:14px}
footer{color:var(--dim);font-size:12.5px;text-align:center;padding:22px}
</style>
</head>
<body>
<header>
  <img class="logo l" src="logo.svg" alt="Ketchup">
  <img class="logo d" src="logo-light.svg" alt="Ketchup">
  <div>
    <h1>About Ketchup</h1>
    <div class="sub">A fast, slim, Arch-based desktop OS</div>
  </div>
</header>
<div class="wrap">
  <div class="bar">
    <a class="btn p" href="https://github.com/ANANDHUAJITH/ketchup-info" target="_blank" rel="noopener">Open on GitHub</a>
    <a class="btn" href="https://github.com/ketchup-os/ketchup" target="_blank" rel="noopener">Ketchup source</a>
    <a class="btn" href="https://github.com/ketchup-os/ketchup/discussions" target="_blank" rel="noopener">Discussions</a>
  </div>
  <div class="card">
    <div id="readme" class="readme">
      <p class="state" id="state">Loading README from GitHub…</p>
    </div>
  </div>
</div>
<footer>Run <code>ketchup-logo</code> or <code>ketchup-rebrand</code> any time to make this OS yours.</footer>

<script>
const REPO = "ANANDHUAJITH/ketchup-info";
const readmeEl = document.getElementById("readme");
const stateEl = document.getElementById("state");

function escapeHtml(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

// A small, dependency-free Markdown -> HTML renderer. Good enough for READMEs:
// headings, bold/italic, inline code, fenced code blocks, links, images,
// unordered/ordered lists, blockquotes, horizontal rules, tables, paragraphs.
function renderMarkdown(src) {
  const lines = src.replace(/\r\n/g, "\n").split("\n");
  let html = "";
  let i = 0;
  let inCode = false, codeBuf = [], codeLang = "";
  let listStack = []; // {type, indent}

  function closeLists() {
    while (listStack.length) {
      html += listStack.pop().type === "ol" ? "</ol>" : "</ul>";
    }
  }

  function inline(text) {
    text = escapeHtml(text);
    text = text.replace(/`([^`]+)`/g, "<code>$1</code>");
    text = text.replace(/!\[([^\]]*)\]\(([^)\s]+)[^)]*\)/g, '<img alt="$1" src="$2">');
    text = text.replace(/\[([^\]]+)\]\(([^)\s]+)[^)]*\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    text = text.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    text = text.replace(/__([^_]+)__/g, "<strong>$1</strong>");
    text = text.replace(/\*([^*]+)\*/g, "<em>$1</em>");
    text = text.replace(/(^|[^_])_([^_]+)_([^_]|$)/g, "$1<em>$2</em>$3");
    return text;
  }

  function isTableSep(line) {
    return /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(line);
  }

  while (i < lines.length) {
    const raw = lines[i];

    if (inCode) {
      if (/^\s*```/.test(raw)) {
        html += `<pre><code${codeLang ? ' class="lang-' + codeLang + '"' : ""}>${escapeHtml(codeBuf.join("\n"))}</code></pre>`;
        inCode = false; codeBuf = []; codeLang = "";
      } else {
        codeBuf.push(raw);
      }
      i++; continue;
    }

    const fence = raw.match(/^\s*```(\w*)/);
    if (fence) { closeLists(); inCode = true; codeLang = fence[1] || ""; i++; continue; }

    if (/^\s*$/.test(raw)) { closeLists(); i++; continue; }

    if (/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(raw)) { closeLists(); html += "<hr>"; i++; continue; }

    const h = raw.match(/^(#{1,6})\s+(.*)$/);
    if (h) { closeLists(); const lvl = h[1].length; html += `<h${lvl}>${inline(h[2].trim())}</h${lvl}>`; i++; continue; }

    if (/^\s*>\s?/.test(raw)) {
      closeLists();
      const buf = [];
      while (i < lines.length && /^\s*>\s?/.test(lines[i])) { buf.push(lines[i].replace(/^\s*>\s?/, "")); i++; }
      html += `<blockquote>${renderMarkdown(buf.join("\n"))}</blockquote>`;
      continue;
    }

    if (raw.includes("|") && i + 1 < lines.length && isTableSep(lines[i + 1])) {
      closeLists();
      const headCells = raw.split("|").map(c => c.trim()).filter(c => c !== "");
      i += 2;
      let body = "";
      while (i < lines.length && lines[i].includes("|") && lines[i].trim() !== "") {
        const cells = lines[i].split("|").map(c => c.trim()).filter((c, idx, arr) => !(c === "" && (idx === 0 || idx === arr.length - 1)));
        body += "<tr>" + cells.map(c => `<td>${inline(c)}</td>`).join("") + "</tr>";
        i++;
      }
      html += `<table><thead><tr>${headCells.map(c => `<th>${inline(c)}</th>`).join("")}</tr></thead><tbody>${body}</tbody></table>`;
      continue;
    }

    const ol = raw.match(/^(\s*)\d+\.\s+(.*)$/);
    const ul = raw.match(/^(\s*)[-*+]\s+(.*)$/);
    if (ol || ul) {
      const type = ol ? "ol" : "ul";
      const top = listStack[listStack.length - 1];
      if (!top || top.type !== type) { if (top) closeLists(); html += type === "ol" ? "<ol>" : "<ul>"; listStack.push({ type }); }
      html += `<li>${inline((ol || ul)[2])}</li>`;
      i++; continue;
    }

    closeLists();
    let para = [raw];
    i++;
    while (i < lines.length && !/^\s*$/.test(lines[i]) && !/^(#{1,6})\s+/.test(lines[i]) && !/^\s*```/.test(lines[i]) && !/^\s*[-*+]\s+/.test(lines[i]) && !/^\s*\d+\.\s+/.test(lines[i]) && !/^\s*>\s?/.test(lines[i])) {
      para.push(lines[i]); i++;
    }
    html += `<p>${inline(para.join(" "))}</p>`;
  }
  closeLists();
  return html;
}

async function loadReadme() {
  try {
    const res = await fetch(`https://api.github.com/repos/${REPO}/readme`, {
      headers: { "Accept": "application/vnd.github.raw+json" }
    });
    if (!res.ok) {
      if (res.status === 404) {
        throw new Error("That repository (or its README) isn't published yet.");
      }
      throw new Error(`GitHub returned ${res.status}.`);
    }
    const md = await res.text();
    readmeEl.innerHTML = renderMarkdown(md);
  } catch (err) {
    readmeEl.innerHTML =
      `<p class="state">Couldn't load the README automatically.</p>` +
      `<div class="err">${escapeHtml(err.message || String(err))}<br>` +
      `You can read it directly on <a href="https://github.com/${REPO}" target="_blank" rel="noopener">github.com/${REPO}</a>.</div>`;
  }
}

loadReadme();
</script>
</body>
</html>
