---
extraMounts:
    - device: proc
      fs: proc
      mountPoint: /proc
    - device: sysfs
      fs: sysfs
      mountPoint: /sys
    - device: /dev
      mountPoint: /dev
      options: [ bind ]
    - device: tmpfs
      fs: tmpfs
      mountPoint: /run
    - device: /run/udev
      mountPoint: /run/udev
      options: [ bind ]
extraMountsEfi:
    - device: efivarfs
      fs: efivarfs
      mountPoint: /sys/firmware/efi/efivars
mountOptions:
    - filesystem: default
      options: [ defaults, noatime ]
    - filesystem: btrfs
      options: [ defaults, noatime, compress=zstd:1, space_cache=v2 ]
    - filesystem: efi
      options: [ defaults, umask=0077 ]
btrfsSubvolumes:
    - mountPoint: /
      subvolume: /@
    - mountPoint: /home
      subvolume: /@home
    - mountPoint: /var/log
      subvolume: /@log
    - mountPoint: /var/cache
      subvolume: /@cache
    # Separate subvolumes used by ketchup-upgrade (docs/UPDATES.md): @snapshots holds the
    # update snapshots and @ketchup-assets holds personal wallpapers and branding. Neither
    # is part of "/", so updates and rollbacks do not touch them.
    - mountPoint: /.snapshots
      subvolume: /@snapshots
    - mountPoint: /var/lib/ketchup
      subvolume: /@ketchup-assets
