---
defaultGroups: [ users, wheel, video, audio, storage, optical, input, lp, network ]
autologinGroup: autologin
doAutologin: false
sudoersGroup: wheel
setRootPassword: false
availableShells: /bin/bash, /bin/zsh
userShell: /bin/bash
avatarFilePath: ~/.face
doReusePassword: true
passwordRequirements:
    minLength: 1
    maxLength: -1
allowWeakPasswords: true
allowWeakPasswordsDefault: false
user:
    shell: /bin/bash
    forbidden_names: [ root ]
hostname:
    location: EtcFile
    writeHostsFile: true
    template: "ketchup"
    forbidden_names: [ localhost ]
