---
defaultGroups: [ users, wheel, video, audio, storage, optical, input, lp, network ]
autologinGroup: autologin
# Autologin is a checkbox, unchecked by default. Checked: the user joins the "autologin"
# group and ketchup-post-install adds greetd's [initial_session], which starts niri
# without a login screen. Unchecked: the Noctalia Greeter appears at every boot
# (see the greetd autologin warning in ketchup-audit).
displayAutologin: true
doAutologin: false
sudoersGroup: wheel
setRootPassword: false
availableShells: /bin/bash, /bin/zsh
userShell: /bin/bash
avatarFilePath: ~/.face
doReusePassword: true
passwordRequirements:
    minLength: 8
    maxLength: -1
allowWeakPasswords: true
allowWeakPasswordsDefault: false
user:
    shell: /bin/bash
    forbidden_names: [ root ]
hostname:
    location: EtcFile
    writeHostsFile: true
    template: "ketchup"
    forbidden_names: [ localhost ]
