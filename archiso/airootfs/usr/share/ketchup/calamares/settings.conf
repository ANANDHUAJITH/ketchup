---
modules-search: [ local, /usr/lib/calamares/modules ]

instances:
- id:       pre-initramfs
  module:   shellprocess
  config:   shellprocess_pre-initramfs.conf
- id:       limine
  module:   shellprocess
  config:   shellprocess_limine.conf
- id:       post-install
  module:   shellprocess
  config:   shellprocess_post-install.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - luksbootkeyfile
  - luksopenswaphookcfg
  - shellprocess@pre-initramfs
  - initcpiocfg
  - initcpio
  - users
  - networkcfg
  - hwclock
  - shellprocess@limine
  - removeuser
  - shellprocess@post-install
  - umount
- show:
  - finished

branding: ketchup
prompt-install: false
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false
