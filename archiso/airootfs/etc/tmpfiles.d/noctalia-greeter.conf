# Replaces the file of the same name shipped by noctalia-greeter in /usr/lib/tmpfiles.d.
# The state directory and its files (greeter.toml, sync.toml, wallpapers) belong to the
# greetd session user, because the greeter writes sync.toml itself. Z is recursive:
# systemd-tmpfiles refuses to chown a root-owned file inside a directory owned by
# another user.
d /var/lib/noctalia-greeter 0750 greeter greeter -
Z /var/lib/noctalia-greeter - greeter greeter -
