HOOKS=(base udev microcode modconf memdisk archiso archiso_loop_mnt archiso_pxe_common archiso_pxe_nbd archiso_pxe_http archiso_pxe_nfs block filesystems keyboard)
# zstd decompresses far faster than xz at boot (xz was the main source of the
# gap between Limine handing off and the KDE/SDDM splash appearing - xz trades
# boot-time CPU for a smaller image, zstd does not need that trade here).
# Level 19 keeps the ISO roughly as small as the old xz image while keeping
# decompression fast; -T0 uses all cores when the ISO is *built*, not at boot.
COMPRESSION="zstd"
COMPRESSION_OPTIONS=(-19 -T0)
