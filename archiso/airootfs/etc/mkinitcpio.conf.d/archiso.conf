HOOKS=(base udev plymouth microcode modconf memdisk archiso archiso_loop_mnt archiso_pxe_common archiso_pxe_nbd archiso_pxe_http archiso_pxe_nfs block filesystems keyboard)
# zstd decompresses far faster than xz at boot (xz is smaller but noticeably slower to unpack
# every boot); the live ISO already squashfs-compresses the rootfs, so initramfs size matters
# much less than how fast it unpacks before init even starts.
COMPRESSION="zstd"
COMPRESSION_OPTIONS=(-19 -T0)
