# Configuration for ketchup-upgrade and ketchup-notifyd: KEY=value shell assignments.
# Changes apply the next time the tools run.

# Project repositories (https://github.com/ANANDHUAJITH/...):
#   ketchup      announcements (notif.yml)
#   ketchup-pkg  the pacman repository and release.yml; KETCHUP_PKG_REPO_NAME must match
#                the [ketchup-pkg] section in /etc/pacman.conf. See docs/UPDATES.md.
KETCHUP_NOTIFY_URL="https://raw.githubusercontent.com/ANANDHUAJITH/ketchup/main/notif.yml"
KETCHUP_RELEASE_MANIFEST_URL="https://raw.githubusercontent.com/ANANDHUAJITH/ketchup-pkg/main/release.yml"
KETCHUP_PKG_REPO_NAME="ketchup-pkg"

# Informational; release.yml decides what is offered.
KETCHUP_CHANNEL="stable"

# Notify (yes) or only log (no) when ketchup-upgrade-check.timer finds updates.
KETCHUP_CHECK_NOTIFY="yes"

# Allow ketchup-upgrade --auto to apply updates instead of only checking. Off by default
# because applying an update ends with a reboot.
KETCHUP_AUTO_APPLY="no"

# Root snapshots to keep, in addition to the "previous system" snapshot.
KETCHUP_KEEP_SNAPSHOTS=3
