LABEL ketchup64
TEXT HELP
Boot the Ketchup install medium on BIOS.
It allows you to install Ketchup or perform system maintenance.
ENDTEXT
MENU LABEL Ketchup default (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-zen
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-zen.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cow_spacesize=4G copytoram=n module_blacklist=pcspkr nvme_load=yes quiet splash loglevel=3

# Fallback (nomodeset)
LABEL ketchup64fb
TEXT HELP
Boot the Ketchup install medium on Bios in fallback mode
It allows you to install Ketchup or perform system maintenance.
ENDTEXT
MENU LABEL Ketchup Fallback (nomodeset, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-zen
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-zen.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cow_spacesize=4G copytoram=n module_blacklist=nvidia,nvidia_modeset,nvidia_uvm,nvidia_drm,pcspkr nomodeset nvme_load=yes

# Compat: for "irq N: nobody cared" storms / very slow boot
LABEL ketchup64irq
TEXT HELP
Boot with irqpoll and pci=nomsi. Try this if boot hangs on "irq nobody cared".
ENDTEXT
MENU LABEL Ketchup compat (irqpoll, pci=nomsi, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-zen
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-zen.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cow_spacesize=4G copytoram=n module_blacklist=pcspkr irqpoll pci=nomsi
