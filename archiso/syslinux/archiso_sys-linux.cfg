LABEL ketup64
TEXT HELP
Boot the Ketup install medium on BIOS.
It allows you to install Ketup or perform system maintenance.
ENDTEXT
MENU LABEL Ketup default (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-zen
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-zen.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cow_spacesize=10G copytoram=auto module_blacklist=pcspkr nvme_load=yes

# Fallback (nomodeset)
LABEL ketup64fb
TEXT HELP
Boot the Ketup install medium on Bios in fallback mode
It allows you to install Ketup or perform system maintenance.
ENDTEXT
MENU LABEL Ketup Fallback (nomodeset, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-zen
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-zen.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cow_spacesize=10G copytoram=auto module_blacklist=nvidia,nvidia_modeset,nvidia_uvm,nvidia_drm,pcspkr nomodeset nvme_load=yes
