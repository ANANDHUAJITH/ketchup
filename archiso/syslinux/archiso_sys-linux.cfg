LABEL ketchup64
TEXT HELP
Boot the Ketchup install medium on BIOS.
It allows you to install Ketchup or perform system maintenance.
ENDTEXT
MENU LABEL Ketchup default (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-zen
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-zen.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cow_spacesize=4G copytoram=n module_blacklist=pcspkr nvme_load=yes noirqdebug systemd.condition-needs-update=0 quiet splash loglevel=3 vt.global_cursor_default=0

LABEL ketchup64persist
TEXT HELP
Boot with the persistence partition made by "ketchup-persist create".
Use the default entry until that partition exists.
ENDTEXT
MENU LABEL Ketchup persistent (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-zen
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-zen.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cow_label=KETCHUP_PERSIST copytoram=n module_blacklist=pcspkr nvme_load=yes noirqdebug systemd.condition-needs-update=0 quiet splash loglevel=3 vt.global_cursor_default=0

LABEL ketchup64fb
TEXT HELP
Boot the Ketchup install medium on Bios in fallback mode
It allows you to install Ketchup or perform system maintenance.
ENDTEXT
MENU LABEL Ketchup Fallback (nomodeset, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-zen
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-zen.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cow_spacesize=4G copytoram=n module_blacklist=nvidia,nvidia_modeset,nvidia_uvm,nvidia_drm,pcspkr nomodeset nvme_load=yes noirqdebug systemd.condition-needs-update=0

LABEL ketchup64irq
TEXT HELP
Boot with irqpoll and pci=nomsi. Try this if boot hangs on "irq nobody cared".
ENDTEXT
MENU LABEL Ketchup compat (irqpoll, pci=nomsi, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-zen
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-zen.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cow_spacesize=4G copytoram=n module_blacklist=pcspkr irqpoll pci=nomsi systemd.condition-needs-update=0
