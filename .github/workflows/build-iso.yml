name: Build Ketup ISO

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 3 1 * *'   # monthly rebuild so the ISO ships fresh packages

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # needed to publish releases

jobs:
  lint:
    name: Lint scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck (errors only)
        run: |
          shopt -s globstar nullglob
          shellcheck -S warning -s bash ci-build.sh archiso/airootfs/usr/local/bin/ketup-*
      - name: YAML sanity (Calamares configs)
        run: |
          python3 -m pip install --quiet pyyaml
          python3 - <<'PY'
          import glob, yaml
          files = glob.glob('archiso/airootfs/usr/share/ketup/calamares/**/*.conf', recursive=True) + glob.glob('archiso/airootfs/usr/share/calamares/branding/ketup/branding.desc')
          for f in files: yaml.safe_load(open(f))
          print(len(files), 'files OK')
          PY

  build:
    name: Build ISO
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      builddate: ${{ steps.date.outputs.builddate }}
    steps:
      - uses: actions/checkout@v4

      - name: Get build date
        id: date
        run: echo "builddate=$(date +'%y%m%d')" >> "$GITHUB_OUTPUT"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - name: Build ISO in Arch Linux container
        run: |
          docker run --rm --privileged \
            -v "$PWD":/work -w /work \
            archlinux:base-devel ./ci-build.sh

      - name: Show result
        run: ls -lh out/desktop/

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: ketup-iso-${{ steps.date.outputs.builddate }}
          path: out/desktop/*
          if-no-files-found: error
          compression-level: 0

      - name: Check ISO fits GitHub release limit (2 GiB per file)
        id: size
        run: |
          iso=$(ls out/desktop/*.iso)
          sz=$(stat -c %s "$iso")
          echo "ISO size: $sz bytes"
          if [ "$sz" -lt 2147483648 ]; then echo "release=true" >> "$GITHUB_OUTPUT"; else echo "release=false" >> "$GITHUB_OUTPUT"; echo "::warning::ISO is larger than 2 GiB, so it is attached as a workflow artifact only"; fi

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v') && steps.size.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/desktop/*.iso
            out/desktop/*.sha256
            out/desktop/*.pkgs.txt
          generate_release_notes: true
